name: booking_system_flutter
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.1+11

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # COMMON
  web_socket_channel: ^3.0.1
  nb_utils: ^7.1.8
  google_fonts: ^6.3.3
  html: ^0.15.6
  http: ^1.6.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2

  # FIREBASE
  firebase_core: ^4.3.0
  firebase_crashlytics: ^5.0.6
  firebase_auth: ^6.1.3
  firebase_storage: ^13.0.5
  cloud_firestore: ^6.1.1

  # FIREBASE MESSAGING
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^19.5.0

  # STATE MANAGEMENT
  mobx: ^2.5.0
  flutter_mobx: ^2.3.0

  # ICON
  flutter_vector_icons: ^2.0.0

  # IMAGE
  image_picker: ^1.2.1
  photo_view: ^0.15.0
  lottie: ^3.3.2

  # OTP/PIN INPUT
  pin_code_fields: ^8.0.1

  # OTHER
  country_picker: ^2.0.27
  flutter_custom_tabs: ^2.4.1
  permission_handler: ^12.0.1
  flutter_html: ^3.0.0-beta.2
  path_provider: ^2.1.5
  file_picker: ^10.3.7

  # SOCIAL LOGIN
  google_sign_in: ^7.2.0
  the_apple_sign_in: ^1.1.1

  # MAP
  google_maps_flutter: ^2.14.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  latlong2: ^0.9.1

  flutter_localizations:
    sdk: flutter
  share_plus: ^12.0.1
  app_links: ^6.4.1
  agora_rtc_engine: ^6.3.2
  flutter_ringtone_player: ^4.0.0+4
  flutter_tts: ^4.2.1
  flutter_callkit_incoming: ^2.3.2
  record: ^7.1.1
  audioplayers: ^6.8.1
  pdf: ^3.12.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  mobx_codegen: ^2.7.4
  flutter_launcher_icons: "^0.14.4"  
  #dart run build_runner build --delete-conflicting-outputs

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/
    - assets/flag/
    - assets/images/
    - assets/lottie/
    - assets/logo/
    - assets/fonts/invoice/


  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf

# Configuration for flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/ic_app_logo.png"
    background_color: "#FFFFFF"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/ic_app_logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/ic_app_logo.png"
