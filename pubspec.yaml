name: booking_system_flutter
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # COMMON
  nb_utils: ^7.1.8
  google_fonts: ^6.3.3
  html: ^0.15.6
  http: ^1.6.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  speech_to_text: ^7.3.0

  # FIREBASE
  firebase_core: ^4.3.0
  firebase_crashlytics: ^5.0.6
  firebase_auth: ^6.1.3
  firebase_storage: ^13.0.5
  cloud_firestore: ^6.1.1
  firebase_pagination: ^4.2.0

  # FIREBASE MESSAGING
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^19.5.0

  # STATE MANAGEMENT
  mobx: ^2.5.0
  flutter_mobx: ^2.3.0

  # ICON
  flutter_vector_icons: ^2.0.0
  flutter_svg: ^2.2.3

  # IMAGE
  image_picker: ^1.2.1
  photo_view: ^0.15.0
  lottie: ^3.3.2

  # OTP/PIN INPUT
  pin_code_fields: ^8.0.1

  # OTHER
  country_picker: ^2.0.27
  flutter_custom_tabs: ^2.4.1
  permission_handler: ^12.0.1
  flutter_html: ^3.0.0-beta.2
  path_provider: ^2.1.5
  webview_flutter: ^4.13.0
  file_picker: ^10.3.7

  # SOCIAL LOGIN
  google_sign_in: ^7.2.0
  the_apple_sign_in: ^1.1.1

  # PAYMENT GATEWAYS
  midpay:
    git:
      url: https://github.com/iqonic-design/midpay.git
      ref: main
  qr_flutter: ^4.1.0 #required for in pix_flutter
  pix_flutter: ^2.2.0
  razorpay_flutter: ^1.4.0
  flutterwave_standard:
    git:
      url: https://github.com/iqonic-design/flutterwave_standard.git
      ref: main
  flutter_stripe: ^12.1.1
  cinetpay:
    git:
      url: https://github.com/iqonic-design/cinetpay.git
      ref: main
  flutter_paypal_checkout:
    git:
      url: https://github.com/iqonic-design/flutter_paypal_checkout.git
      ref: main

  flutter_paystack:
    git:
      url: https://github.com/iqonic-design/flutter_paystack.git
      ref: 1.5.0

  # MAP
  google_maps_flutter: ^2.14.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  google_places_flutter: ^2.0.9

  flutter_localizations:
    sdk: flutter
  carousel_slider: ^5.1.1
  share_plus: ^12.0.1
  app_links: ^6.4.1
  dotted_border: ^3.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  mobx_codegen: ^2.7.4
  flutter_launcher_icons: "^0.14.4"  
  #dart run build_runner build --delete-conflicting-outputs

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/
    - assets/flag/
    - assets/images/
    - assets/icons/upi_payment/
    - assets/lottie/
    - assets/newDashboard/
    - assets/json/


  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf

# Configuration for flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/ic_fill_home.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/ic_fill_home.png"
  web:
    generate: true
    image_path: "assets/icons/ic_fill_home.png"
    background_color: "#FFFFFF"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/icons/ic_fill_home.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/ic_fill_home.png"
