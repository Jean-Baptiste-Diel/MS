workflows:
  ios-simulator:
    name: iOS Simulator (App Preview)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - fire
      vars:
        BUNDLE_ID: "com.mison.serviceuser"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Restore Firebase config
        script: |
          set -e
          if [ -z "$FIREBASE_OPTIONS_B64" ]; then
            echo "FIREBASE_OPTIONS_B64 est vide ou absente" >&2
            exit 1
          fi
          echo "$FIREBASE_OPTIONS_B64" | base64 --decode > "$CM_BUILD_DIR/lib/firebase_options.dart"
          echo "firebase_options.dart restauré ($(wc -c < "$CM_BUILD_DIR/lib/firebase_options.dart") octets)"
      - name: Disable Swift Package Manager
        script: flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter build iOS (simulateur)
        script: flutter build ios --simulator --debug
    artifacts:
      - build/ios/iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - jeanbaptistedielinang@gmail.com
